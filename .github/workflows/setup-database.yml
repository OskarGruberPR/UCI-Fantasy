name: Datenbank einrichten

# Prüft die SQL-Module und die erzeugte supabase/schema.sql auch in Pull Requests.
# Spielt das Schema auf main und per Knopfdruck ein. Das Skript ist wiederholbar.
# Braucht das Secret SUPABASE_DB_URL (Supabase → Connect → Session pooler, mit Passwort).

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/setup-database.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/setup-database.yml']
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  validate:
    name: SQL-Build prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build-Skript testen
        run: node --test supabase/build-schema.test.mjs
      - name: Erzeugtes Schema mit den Modulen vergleichen
        run: node supabase/build-schema.mjs --check

  migrate:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob der Zugang hinterlegt ist
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt (Supabase → Connect → Session pooler)."
            exit 1
          fi
      - run: sudo apt-get install -y -qq postgresql-client
      - name: Schema einspielen
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: GitHub-Schlüssel für den Zeitplaner in den Vault übernehmen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then echo "::warning::Secret GH_DISPATCH_TOKEN fehlt – Zeitplaner kann keine Abläufe starten."; exit 0; fi
          psql "$SUPABASE_DB_URL" -q -v ON_ERROR_STOP=1 -v token="$GH_DISPATCH_TOKEN" -f - <<'SQL'
          select vault.update_secret(id, :'token') from vault.secrets where name = 'github_dispatch_token';
          select vault.create_secret(:'token', 'github_dispatch_token')
           where not exists (select 1 from vault.secrets where name = 'github_dispatch_token');
          SQL
          echo "Schlüssel im Vault hinterlegt."
      - name: Schema-Cache der API neu laden
        run: psql "$SUPABASE_DB_URL" -q -c "notify pgrst, 'reload schema';"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
