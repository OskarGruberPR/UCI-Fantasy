name: Fahrerliste importieren

on:
  workflow_dispatch:        # nur per Knopfdruck, z. B. vor dem Draft

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade -r pcs_sync/requirements.txt
      - run: python import_riders.py
        working-directory: pcs_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
